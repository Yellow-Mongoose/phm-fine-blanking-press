name: kamp_repo
channels:
  - defaults
dependencies:
  - python=3.9.7
  - pip
  - pip:
      # KAMP guidebook baseline runtime (CPU on Windows)
      - tensorflow==2.7.0
      # TensorFlow 2.7 needs these pins with current pip resolvers.
      - tensorboard==2.7.0
      - protobuf==3.20.3
      - numpy==1.19.5
      - pandas==1.3.5
      - scikit-learn==1.0.2
      - matplotlib==3.5.1
      # Matplotlib 3.5.x requires the pre-0.2 inline backend in Jupyter.
      - matplotlib-inline==0.1.7
      - seaborn==0.11.2
      # Sensor-fusion LSTM-AE runtime: CUDA 11.8 wheel for the project's GTX 1050 Ti.
      # Keep this as an extra index so the TensorFlow 2.7 packages still resolve from PyPI.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - tqdm==4.70.1
