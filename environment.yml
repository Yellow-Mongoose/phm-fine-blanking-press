name: kamp_repo
channels:
  - defaults
dependencies:
  - python=3.9.7
  - pip
  - pip:
      # KAMP guidebook baseline runtime (CPU on Windows)
      - tensorflow==2.7.0
      # TensorFlow 2.7 needs these pins with current pip resolvers.
      - tensorboard==2.7.0
      - protobuf==3.20.3
      - numpy==1.19.5
      - pandas==1.3.5
      - scikit-learn==1.0.2
      - matplotlib==3.5.1
      - seaborn==0.11.2
